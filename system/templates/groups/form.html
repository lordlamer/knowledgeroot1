{% extends "layout.html" %}

{% block title %}{{ (mode == 'add' ? 'add group' : 'edit')|trans }} - {{ site_title }}{% endblock %}

{% block body %}
{% include "_topnav.html" %}

<div class="container" style="max-width: 640px; margin-top: 20px;">

    {% if error %}
        <div class="alert alert-warning" role="alert">{{ error }}</div>
    {% endif %}

    <div class="card">
        <div class="card-header">
            {{ (mode == 'add' ? 'add group' : 'edit')|trans }}
        </div>
        <div class="card-body">
            <form action="{{ mode == 'add' ? base_url ~ 'groups/new' : base_url ~ 'groups/' ~ group_id }}" method="post">
            <input type="hidden" name="_csrf" value="{{ csrf_token }}">

                <div class="form-group">
                    <label for="name">{{ 'name'|trans }}</label>
                    <input type="text" class="form-control" name="name" id="name" value="{{ name }}" required>
                </div>

                <div class="form-group">
                    <button class="btn btn-primary" type="submit">{{ 'save'|trans }}</button>
                    <a class="btn btn-link" href="{{ base_url }}users">{{ 'user'|trans }}</a>
                </div>

            </form>
        </div>
    </div>

</div>
{% endblock %}
