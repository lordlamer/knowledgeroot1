<div class="card">
    <div class="card-header">
        {{ 'login'|trans }}
    </div>
    <div class="card-body">

        <form action="index.php" method="post" name="loginformular">
            <input type="hidden" name="{{session_name}}" value="{{session_id}}" />
            <input type="hidden" name="login" value="login" />

            <div class="form-group">
                <label for="user">{{ 'user'|trans }}</label>
                <input type="text" class="form-control" name="user" id="user" aria-describedby="emailHelp" placeholder="{{ 'user'|trans }}">
            </div>
            <div class="form-group">
                <label for="password">{{ 'password'|trans }}</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="{{ 'password'|trans }}">
            </div>

            <button class="btn btn-primary" type="submit" name="loginbutton">{{ 'login'|trans }}</button>

        </form>

    </div>
</div>
