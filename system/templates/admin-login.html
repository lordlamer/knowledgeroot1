<!doctype html>
<html lang="en">
<head>
	<link rel="stylesheet" href="admin.css" type="text/css" />
	<style>
        html {
            position: relative;
            min-height: 100%;
        }
        body {
            /* Margin bottom by footer height */
            margin-top: 60px;
        }

        .form-signin {
            width: 100%;
            max-width: 360px;
            padding: 15px;
            margin: 0 auto;
        }
    </style>
	{{ head|raw }}
</head>
<body class="hold-transition login-page">
<header>
    <nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark" style="border-bottom: 3px solid #F88529;">
        <a class="navbar-brand" href="{{ back_url }}"><i class="fa fa-arrow-left" aria-hidden="true"></i> {{ back_text }}</a>
    </nav>
</header>

<div class="form-signin">
    <h1>Knowledgeroot</h1>
    <form class="login" action="index.php" method="post" name="loginformular">
        <input type="hidden" name="login" value="true" />
        <div class="form-group has-feedback">
            <input type="text" class="form-control" placeholder="{{ username_label }}" name="user" id="user">
            <span class="glyphicon glyphicon-user form-control-feedback"></span>
        </div>
        <div class="form-group has-feedback">
            <input type="password" class="form-control" placeholder="{{ password_label }}" name="pass" id="pass">
            <span class="glyphicon glyphicon-lock form-control-feedback"></span>
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-flat">{{ login_text }}</button>
    </form>
    {% if login_hash != '' %}
    <div class="alert alert-warning">loginhash: {{ login_hash }}</div>
    {% endif %}
    <div class="alert alert-info" role="alert">
        <h4 class="alert-heading">{{ forgot_title }}</h4>
        <p>
            {{ forgot_body|raw }}
        </p>
    </div>
</div>
</body>
</html>
